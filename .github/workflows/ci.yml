name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - name: Validate workflow files
        # One file per invocation: the validator takes a single path and exits 0
        # on a glob it never read, which would look like a passing check.
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yml; do
            echo "validating $file"
            npx --yes @action-validator/cli@latest "$file"
          done
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
