name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  # A label event runs a full review of its own, so cancelling one would leave
  # the result resting on a cancelled run.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  review:
    # Fork pull requests get no secrets and a read-only token, so the reviewer
    # cannot run. They are simply not reviewed here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: review
        uses: jack2k0/ai-toolkit/.github/actions/ai-code-review@b672e61f76728877e8c202007d0857cb1c88b480
        with:
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          # The product contract and the agent rules. These turn on the
          # business-alignment and architectural-fit criteria, which stay
          # unscored without them.
          context-files: |
            context/foundation/prd.md
            AGENTS.md
          # Advisory here, not a merge gate. The deterministic gates for this
          # repository are `npm test`, `npm run lint` and `npm run build` in
          # ci.yml; the agent comments, it does not block.
          fail-on-review: "false"
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### AI code review"
            echo "- status: \`${{ steps.review.outputs.status }}\`"
            echo "- verdict: \`${{ steps.review.outputs.verdict }}\`"
            echo "- advisory only — see ci.yml for the gates that block merge"
          } >> "$GITHUB_STEP_SUMMARY"
